services:

  - type: web

    name: ai-traffic-management

    runtime: python

    buildCommand: pip install -r requirements.txt

    startCommand: gunicorn app:app --workers 1 --timeout 120

    envVars:

      - key: SECRET_KEY
        generateValue: true

      - key: ADMIN_USER
        value: admin

      - key: ADMIN_PASSWORD
        sync: false
